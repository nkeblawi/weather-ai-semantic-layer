resources:
  jobs:
    wx_obs_ingest_ghcn:
      name: wx_obs_ingest_ghcn
      tasks:
        - task_key: ingest_ghcn
          environment_key: wx_env_v1
          run_if: ALL_SUCCESS
          spark_python_task:
            parameters:
              - "--workspace-root"
              - "${workspace.file_path}/src"
              - "--catalog"
              - "${var.catalog}"
            python_file: ../src/wx/obs/ingest_ghcn.py
      email_notifications:
        on_failure:
          - kebnab@gmail.com
      environments:
        - environment_key: wx_env_v1
          spec:
            dependencies:
              - pybreaker==1.4.1
            environment_version: "5"
      max_concurrent_runs: 1
      notification_settings:
        no_alert_for_canceled_runs: false
        no_alert_for_skipped_runs: false
      performance_target: PERFORMANCE_OPTIMIZED
      queue:
        enabled: true
      schedule:
        pause_status: UNPAUSED
        quartz_cron_expression: 25 0 23 * * ?
        timezone_id: America/New_York
