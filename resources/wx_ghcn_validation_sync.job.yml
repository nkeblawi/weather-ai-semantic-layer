resources:
  jobs:
    wx_ghcn_validation_sync:
      name: wx_ghcn_validation_sync
      tasks:
        - task_key: ghcn_validation_sync
          run_if: ALL_SUCCESS
          # a SQL file, not the saved query: only a file task is documented to run
          # every statement in it
          sql_task:
            parameters:
              catalog: ${var.catalog}
            file:
              path: ${workspace.file_path}/sql/maintenance/ghcn_validation_sync.sql
              source: WORKSPACE
            warehouse_id: 806413d104ce2150  # Serverless Starter Warehouse
      email_notifications:
        on_failure:
          - kebnab@gmail.com
      max_concurrent_runs: 1
      notification_settings:
        no_alert_for_canceled_runs: false
        no_alert_for_skipped_runs: false
      queue:
        enabled: true
      schedule:
        pause_status: UNPAUSED
        # 2 am ET on the 1st: after the 11:45 pm transform
        quartz_cron_expression: 0 0 2 1 * ?
        timezone_id: America/New_York
