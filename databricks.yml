# This is a Declarative Automation Bundle definition for the weather semantics AI projett
bundle:
  name: wxai
  uuid: 5fa89993-5553-4e85-8aa3-a738987fb4d4

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use

targets:
  # Development target
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-958231c0-60ed.cloud.databricks.com
    variables:
      catalog: weather_dev
    # jobs run as their own service principal, not the deploying user (as in prod)
    run_as:
      service_principal_name: 51350910-c9c9-404e-b8a2-5e8438b018f5  # wx-jobs-sp-dev
    permissions:
      - user_name: kebnab@gmail.com
        level: CAN_MANAGE
      - service_principal_name: 51350910-c9c9-404e-b8a2-5e8438b018f5
        level: CAN_VIEW
    resources:
      jobs:
        wx_obs_ingest_ghcn:
          schedule:
            pause_status: PAUSED
        wx_obs_ingest_acis:
          schedule:
            pause_status: PAUSED
        wx_obs_transform:
          schedule:
            pause_status: PAUSED
        wx_app_retention:
          schedule:
            pause_status: PAUSED
        wx_ghcn_validation_sync:
          schedule:
            pause_status: PAUSED
  # Production target
  prod:
    mode: production
    workspace:
      host: https://dbc-958231c0-60ed.cloud.databricks.com
      root_path: /Workspace/Users/kebnab@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: weather
    run_as:
      service_principal_name: 23f6fe6c-b5d1-4abc-9735-99d4761681af  # wx-jobs-sp-prod
    permissions:
      - user_name: kebnab@gmail.com
        level: CAN_MANAGE
      - service_principal_name: 23f6fe6c-b5d1-4abc-9735-99d4761681af
        level: CAN_VIEW
